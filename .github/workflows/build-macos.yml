name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: arm64 DMG
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VITE_API_BASE: https://api.theaceservices.site/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-electron-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: macos-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package arm64 DMG
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: acehrm-macos-arm64
          path: frontend/release_build/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" frontend/release_build/*.dmg --clobber
          else
            gh release create "$TAG" frontend/release_build/*.dmg \
              --title "aceHRM $TAG" --generate-notes
          fi
