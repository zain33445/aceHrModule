<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  button { width: 60px; height: 60px; margin: 6px; border-radius: 50%; border: none; cursor: grab;
    touch-action: none; background: #f97316; color: #fff; font-size: 28px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
</style>
</head>
<body>
<button id="b" title="Open chat (drag to move)">💬</button>
<script>
  // Drag moves the window by pointer deltas; a drag > 3px suppresses the click
  const b = document.getElementById('b');
  let drag = null;
  b.onpointerdown = (e) => {
    b.setPointerCapture(e.pointerId);
    drag = { x: e.screenX, y: e.screenY, moved: 0 };
  };
  b.onpointermove = (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!dx && !dy) return;
    drag.x = e.screenX; drag.y = e.screenY; drag.moved += Math.abs(dx) + Math.abs(dy);
    window.electronAPI.moveChatBubble(dx, dy);
  };
  b.onpointerup = () => {
    if (drag && drag.moved <= 3) window.electronAPI.openChatBubble();
    drag = null;
  };
</script>
</body>
</html>
